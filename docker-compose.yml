services:
  app:
    build: .
    container_name: procurement_app
    restart: unless-stopped
    environment:
      - SESSION_SECRET=${SESSION_SECRET}
      - NODE_ENV=production
      - TZ=Asia/Bangkok
      # Postgres is the source of truth (database `procurement` on the shared
      # mmi-postgres server, reached over the external mmi_pg network).
      # Roles and grants: db/postgres_setup.sql.
      - PGHOST=mmi-postgres
      - PGPORT=5432
      - PGDATABASE=procurement
      - PGUSER=procurement_app
      - PGPASSWORD=${PG_APP_PASSWORD:?set PG_APP_PASSWORD in .env (RUNBOOK_POSTGRES_CUTOVER.md)}
      # ClickHouse is now the warehouse only. The app image still carries
      # these for migrate_ch_to_pg.js (run with `docker compose run`). The
      # container name, not the service alias `clickhouse`, because this
      # service also sits on the shared mmi_pg network, where another
      # project's service could answer to a generic name.
      - CLICKHOUSE_HOST=procurement_clickhouse
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_DB=procurement
      - CLICKHOUSE_USER=procurement_user
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
    ports:
      # NOTE: INFRASTRUCTURE.md advertises the app directly on :3000 while
      # OPERATIONS.md says port 80 via nginx. Until that is settled this stays
      # public — closing it would take procurement offline if the docs are
      # wrong. The app does have its own login.
      - "3000:3000"
    networks:
      - procurement_net
      - mmi_pg
    cpus: 0.5
    mem_limit: 512m
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }
    # No depends_on: the app no longer needs ClickHouse to serve requests, and
    # compose cannot depend on mmi-postgres (another project's container).
    # The app exits if Postgres is unreachable at startup and
    # `restart: unless-stopped` retries until it is up.

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    container_name: procurement_clickhouse
    restart: unless-stopped
    environment:
      - CLICKHOUSE_DB=procurement
      - CLICKHOUSE_USER=procurement_user
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
      # Read by db/clickhouse-config.d/30-pg-source.xml (from_env) for the
      # warehouse sync's pg_procurement named collection. SELECT-only role.
      - PG_RO_PASSWORD=${PG_RO_PASSWORD:?set PG_RO_PASSWORD in .env (RUNBOOK_POSTGRES_CUTOVER.md)}
      # Read by db/clickhouse-config.d/40-pg-hauling.xml (from_env) for the
      # hauling mirror's pg_hauling named collection (SELECT-only hauling_ro
      # on hauling_tracker). Empty default, deliberately not `:?`: deploys of
      # the app (`docker compose up -d --build app`) must keep working on a
      # server where this is not set yet. Unset means only the mirror sync fails.
      - HAULING_RO_PASSWORD=${HAULING_RO_PASSWORD:-}
      # Read by db/clickhouse-config.d/50-pg-minimart.xml (from_env) for the
      # minimart mirror's pg_minimart named collection (SELECT-only minimart_ro
      # on the minimart database). Same empty-default reasoning as above.
      - MINIMART_RO_PASSWORD=${MINIMART_RO_PASSWORD:-}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./db/clickhouse_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      # Sizes ClickHouse for a shared 2-core box — see the comments in each.
      - ./db/clickhouse-config.d/10-small-host.xml:/etc/clickhouse-server/config.d/10-small-host.xml:ro
      - ./db/clickhouse-config.d/20-users.xml:/etc/clickhouse-server/users.d/20-users.xml:ro
      # Warehouse sync from Postgres: the source connection, and the grant
      # that lets procurement_user use it. See scripts/ch_sync.sh.
      - ./db/clickhouse-config.d/30-pg-source.xml:/etc/clickhouse-server/config.d/30-pg-source.xml:ro
      - ./db/clickhouse-config.d/30-pg-source-users.xml:/etc/clickhouse-server/users.d/30-pg-source.xml:ro
      # Hauling mirror (scripts/hauling_sync.sh): source connection to
      # hauling_tracker. Needs no extra grant — the 30- users file above
      # already lets procurement_user use every named collection.
      - ./db/clickhouse-config.d/40-pg-hauling.xml:/etc/clickhouse-server/config.d/40-pg-hauling.xml:ro
      # Minimart mirror (scripts/minimart_sync.sh): source connection to the
      # minimart database. Same: no extra grant needed.
      - ./db/clickhouse-config.d/50-pg-minimart.xml:/etc/clickhouse-server/config.d/50-pg-minimart.xml:ro
    ports:
      # Loopback only. `procurement_app` reaches ClickHouse over
      # procurement_net as host `procurement_clickhouse`, so nothing here needs a public
      # port — and Docker's port publishing bypasses ufw, which left these two
      # open to the internet. For the migrate/import scripts from a laptop,
      # tunnel instead:  ssh -L 8123:127.0.0.1:8123 root@<host>
      - "127.0.0.1:8123:8123"   # HTTP interface
      - "127.0.0.1:9000:9000"   # Native TCP interface
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - procurement_net
      # To pull from mmi-postgres. ClickHouse's 8123/9000 are reachable from
      # other containers on that network too (password-protected, as on
      # procurement_net).
      - mmi_pg
    # The largest CPU consumer on the box on 2026-09-28, at 61.8% while the
    # app it serves was idle. Half a core is ample for this dataset.
    cpus: 0.5
    mem_limit: 2g
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }

volumes:
  clickhouse_data:

networks:
  procurement_net:
    driver: bridge
  # The Docker network the shared mmi-postgres container is on. Not created or
  # managed by this project; find its name with
  #   docker inspect mmi-postgres -f '{{range $k,$v := .NetworkSettings.Networks}}{{$k}}{{"\n"}}{{end}}'
  # and put it in .env as MMI_PG_NETWORK.
  mmi_pg:
    external: true
    name: ${MMI_PG_NETWORK:?set MMI_PG_NETWORK in .env (RUNBOOK_POSTGRES_CUTOVER.md)}
